kind = "data-app"
previewPath = "/"
title = "CereBloom"
version = "1.0.0"
id = "artifacts/cerebloom-web"
router = "path"

[[integratedSkills]]
name = "data-visualization"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 5000

[services.development]
run = "sh -c \"cd /home/runner/workspace/cerebloom && streamlit run app.py --server.port 5000 --server.address 0.0.0.0\""

[services.production]
run = "sh -c \"cd /home/runner/workspace/cerebloom && streamlit run app.py --server.port 5000 --server.address 0.0.0.0\""

[services.env]
PORT = "5000"
BASE_PATH = "/"
